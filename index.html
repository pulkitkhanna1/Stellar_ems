<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stellar Student EMS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="bg-orb bg-orb-a"></div>
    <div class="bg-orb bg-orb-b"></div>

    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">S</div>
          <div>
            <h1>Stellar EMS</h1>
            <p>Student Command Center</p>
          </div>
        </div>

        <nav class="menu" id="menuTabs">
          <button data-tab="today" class="menu-item active">Today</button>
          <button data-tab="planner" class="menu-item">Day-Wise Plan</button>
          <button data-tab="logs" class="menu-item">Error & Study Log</button>
          <button data-tab="library" class="menu-item">Resource Library</button>
        </nav>

      </aside>

      <main class="main">
        <div class="user-strip">
          <div class="user-chip-group">
            <span class="user-strip-icon">👤</span>
            <label for="userSelect" class="user-strip-label">Student:</label>
            <select id="userSelect" class="user-strip-select"></select>
            <button id="addUserBtn" class="btn btn-sm btn-outline" title="Add a new student profile">+ Add User</button>
          </div>
          <div class="user-chip-group">
            <span class="user-strip-icon">📅</span>
            <label for="startDateInput" class="user-strip-label">Start Date:</label>
            <input type="date" id="startDateInput" class="user-strip-date" />
            <button id="applyStartDateBtn" class="btn btn-sm btn-primary" title="Update study calendar start date">Set Date</button>
          </div>
        </div>

        <header class="hero">
          <div>
            <p class="eyebrow">Focus Mode</p>
            <h2 id="heroTitle">Loading your study command center...</h2>
            <p id="heroSub" class="hero-sub"></p>
          </div>
          <div class="hero-stats">
            <div class="stat-card">
              <p>Completion</p>
              <h3 id="completionPct">0%</h3>
            </div>
            <div class="stat-card">
              <p>Completed Tasks</p>
              <h3 id="completedCount">0</h3>
            </div>
            <div class="stat-card">
              <p>Drive Links Mapped</p>
              <h3 id="mappedCount">0</h3>
            </div>
          </div>
        </header>

        <section id="statusBar" class="status"></section>

        <section id="tab-today" class="tab-panel"></section>
        <section id="tab-planner" class="tab-panel hidden"></section>
        <section id="tab-logs" class="tab-panel hidden"></section>
        <section id="tab-library" class="tab-panel hidden"></section>
      </main>
    </div>

    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>

    <script src="./config.js"></script>
    <script src="./data/day-plan-inline.js"></script>
    <script src="./data/public-links-inline.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
